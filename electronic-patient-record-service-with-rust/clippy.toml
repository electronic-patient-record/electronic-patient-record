# LT-9 timezone doctrine: the server runs in UTC and never consults the
# process zone. A caller's "today" comes from an explicit IANA zone (src/tz.rs).
disallowed-types = [
  { path = "chrono::Local", reason = "never read the process time zone; take an explicit zone via crate::tz" },
  { path = "core::num::Saturating", reason = "RCA-INT-4: no saturation" },
  { path = "core::num::Wrapping", reason = "RCA-INT-4: no wrapping" },
]
disallowed-methods = [
  { path = "chrono::Local::now", reason = "never read the process time zone; take an explicit zone via crate::tz" },
  { path = "chrono::Local::today", reason = "never read the process time zone; take an explicit zone via crate::tz" },
  # Checked arithmetic (spec/rust-checked-arithmetic, RCA-ENF-2)
  { path = "core::iter::Iterator::sum", reason = "RCA-AGG-1: use try_fold with checked_add" },
  { path = "core::iter::Iterator::product", reason = "RCA-AGG-1: use try_fold with checked_mul" },
  { path = "core::time::Duration::from_secs_f64", reason = "RCA-TIME-2: use try_from_secs_f64" },
  { path = "core::time::Duration::from_secs_f32", reason = "RCA-TIME-2: use try_from_secs_f32" },
  # RCA-P-3 bans Option::unwrap_or_default too. 51 sites in the service remain (QA-17); it joins this list when they are done.
  { path = "std::time::Instant::duration_since", reason = "RCA-TIME-1: use checked_duration_since" },
  { path = "std::time::Instant::saturating_duration_since", reason = "RCA-INT-4: no saturation" },
  { path = "core::cmp::Ord::clamp", reason = "RCA-INT-6, RCA-IN-2: an out-of-range value is an error, not a bound" },
]

# QA: no panic in production code. Tests may unwrap, expect, panic and index.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
