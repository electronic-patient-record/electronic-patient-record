[workspace]
# The service, and its domain rules as their own crate, so an edit to a route or a store does not rebuild them.
members = [".", "electronic-patient-record-domain"]

[package]
name = "electronic-patient-record"
version = "0.1.0"
edition = "2024"
# The integration tests are listed below: most share one program (LC-15), so an edit relinks one, not eighty.
autotests = false
rust-version = "1.98"
publish = true
default-run = "electronic-patient-record"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Electronic patient record service: the clinical record, audit, consent and a FHIR R4 facade (patient identity first)"
readme = "README.md"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-NC-SA-4.0"
keywords = ["patient", "healthcare", "fhir", "ehr", "epr"]
categories = ["web-programming", "development-tools"]
include = ["src/**/*", "README.md"]

[[bin]]
name = "electronic-patient-record"
path = "src/bin/main.rs"

# No panic in production code (a request that panics is a dropped connection and a lost audit row). Tests may unwrap:
# clippy.toml lifts these three inside `#[cfg(test)]` and `tests/`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[lints]
workspace = true

[workspace.dependencies]
# Shared with the domain crate, so the two never differ.
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
# Benchmarks in the service and the domain crate (spec/performance-testing.md); a dev dependency only.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
jiff = { version = "1", default-features = false, features = ["std", "serde", "tzdb-bundle-always"] }
tracing = { version = "0.1" }
sha2 = "0.11"
toml = "1"
electronic-patient-record-matcher = "0.8.0"
# The shared service plumbing.
axa = { version = "0.21", features = ["api-tokens", "cursor-pagination", "idempotency", "outbox", "postgres-sqlx", "problem", "ratelimit"] }

[dependencies]
axa = { workspace = true }
# The domain rules: no database, no web (electronic-patient-record-domain/).
electronic-patient-record-domain = { version = "0.1.0", path = "electronic-patient-record-domain" }
serde = { workspace = true }
serde_urlencoded = "0.7"
uuid = { workspace = true }
serde_json = { workspace = true }
# Time (DEP-1): jiff 0.2, already in the tree, with its own copy of the time-zone database so the image needs no
# zoneinfo. chrono is unmaintained (RUSTSEC-2026-0543); it is still in the tree through axa, not through this crate.
jiff = { workspace = true }
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { workspace = true }
# TLS on the MLLP listener (IH-10): rustls with ring only, already in the tree through sqlx. The provider is chosen
# explicitly so only ring is built.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The name on a sender's client certificate (IH-6): webpki is already in the tree through rustls; no crypto needed.
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "json", "macros", "migrate"] }
# Keyed integrity MACs for the audit hash chain; SHA-256 for the unkeyed fallback.
integrity-mac = "0.2.0"
sha2 = { workspace = true }
toml = { workspace = true }
url = "2"
# The matcher's `Patient` is the API identity DTO, with no adapter layer. Published crate.
electronic-patient-record-matcher = { workspace = true }
# Offline PASETO v4.public verification against the authentication service's Ed25519 keys, and
# Keycloak (OIDC) access-token verification against a realm's published keys.
authentication-verifier = { version = "0.9.3", default-features = false, features = ["paseto", "fetch", "keycloak"] }

# Interoperability (src/interop). All four are this project's author's crates; `fhir` is built for
# R4 only (each release is ~135k generated lines).
hl7 = "0.2.3"
er7 = "0.2.2"
fhir = { version = "4.2.4", default-features = false, features = ["r4", "r5"] }
snomed = "0.56.1"

[dev-dependencies]
authentication-verifier = { version = "0.9.3", default-features = false, features = ["test-idp"] }
axa-test = "0.12"
criterion = { workspace = true }
tower = { version = "0.5", features = ["util"] }
# Captures log lines in tests, so a test can check that no message value reaches one (IH-4). Already in the tree.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[[bench]]
name = "service"
harness = false

# Faster dev/test builds: keep line tables for backtraces, drop the rest of the debug info.
# RCA-ENF-4: an operator no lint caught panics, which is detectable, instead of wrapping, which is not.
[profile.release]
overflow-checks = true

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false

# One program for the integration tests that share nothing process-wide (tests/suite.rs, LC-15).
[[test]]
name = "suite"
path = "tests/suite.rs"

# Each its own program: it sets the process environment (the auth settings), holds process-wide state, or a script or
