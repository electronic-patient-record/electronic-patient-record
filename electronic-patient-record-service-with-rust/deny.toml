# cargo-deny supply-chain policy (SEC-I1). Used by the `deny` job
# of `.github/workflows/ci.yml` (`cargo deny check`). Copied per crate (drift-accepted,
# same posture as the other per-crate configs); keep the crates in sync
# when this policy changes.

[advisories]
version = 2
yanked = "warn"
# Every ignore says why and when it lapses. Write the lapse date as `expires YYYY-MM-DD` in the
# comment on the same line; `tests/advisory_expiry.rs` fails when a date has passed, is missing, or is
# more than about six months ahead, so an ignore cannot sit here forgotten. Re-check by running
# `cargo deny check advisories` with the ignore removed: if it no longer fires (`advisory-not-detected`
# warns about a dead one), delete the line. Real, actionable advisories not listed here fail the build.
#
# 2026-10-30: twelve earlier ignores were removed because `cargo deny` reported each as not encountered
# (the locked versions are patched or the crate is no longer in the tree).
ignore = [
    # unmaintained (not a vulnerability). A normal dependency of loco-rs through serde_yaml_ng, and of
    # loco-gen -> rrgen -> serde_yaml; it parses the deployer's own YAML config files, not patient input.
    # Which code paths of it run was not traced. Revisit on the next loco-rs upgrade.
    "RUSTSEC-2024-0449", # unsafe-libyaml; added 2026-10-13; expires 2027-01-30
]

[licenses]
version = 2
# Permissive licenses used across the Rust / Loco stack. A dependency
# whose license is not listed FAILS the check — a deliberate signal to
# review a new license, not to silently accept it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Local, unpublished crates (the service itself, its `migration` member)
# carry no `license` field and must not be license-checked.
private = { ignore = true }

[bans]
# Duplicate versions are a warning (the loco/sea-orm stack pulls a few);
# not a hard failure, so the gate stays green while still surfacing bloat.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
