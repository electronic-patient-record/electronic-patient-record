[package]
name = "electronic-patient-record-migration"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Database migrations for the electronic patient record service (sea-orm-migration on loco-rs)"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["patient", "healthcare", "migration", "database"]
categories = ["database"]

[lib]
name = "electronic_patient_record_migration"
path = "src/lib.rs"

[dependencies]
loco-rs = { workspace = true }

[dependencies.sea-orm-migration]
version = "2.0"
features = ["runtime-tokio-rustls"]
