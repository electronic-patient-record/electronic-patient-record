# Suspicion pathways (RS-6, `spec/referral-suspicion/index.md`): per suspected condition, when the clock
# starts, the target dates, the priority, and what else the pathway needs (a band chosen from a result, the
# person's agreement, circumstances that raise the priority).
#
# EVERY PATHWAY HERE IS A DRAFT. The figures were read on 2026-11-09 through search summaries of the
# sources named, not the guideline pages; no clinician has approved any of them (approved_by and
# approved_on are empty), and the service shows each as a draft. A deployment replaces this file with its
# own approved catalogue.
#
# Rules the service checks when it reads this file (`src/pathways.rs`):
# - versions of one pathway run 1, 2, 3 ... and none is removed, because a stored suspicion names its
#   pathway version;
# - approved_by and approved_on are both given (a YYYY-MM-DD day) or both empty;
# - a pathway either has bands (the writer must choose one) or its own priority and targets, not both;
# - a target is a whole number of days from the clock start, 0 (the same day) to 365;
# - a pathway with no target anywhere says why in no_target_reason; one with targets leaves it empty;
# - clock_from is point-of-suspicion or referral-sent;
# - priorities are a referral's: routine, urgent, asap, stat;
# - a pathway may have a subtype list (`[pathway.subtypes]`: a scheme, a title, a source, whether it is
#   required, and named codes, none repeated); without one, a suspicion names no subtype. The scheme is
#   stored with the code. The lists below copy the PAS's profiles (its spec 20) so the two agree (RS-5).

