# Pin the Rust toolchain for the whole Electronic Patient Record repository.
#
# Every crate in this tree (the API service, the matcher, the migrations)
# inherits this pin, so `cargo build`, `cargo clippy`, and especially
# `cargo fmt` produce identical results on every machine and in CI (the CI workflow and the
# API Containerfile check that their toolchain matches this pin). It
# exists because a rustfmt version drift caused repo-wide formatting churn;
# pinning the exact toolchain prevents that from recurring.
#
# Bump deliberately (in one commit, re-running `cargo fmt` across all
# crates) rather than letting `rustup` float.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
